name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static website
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for the branch-based Pages workflow
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 36; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                per_page: 100,
              });
              const branchPagesRun = data.workflow_runs.find(
                (run) => run.name === "pages build and deployment",
              );
              if (branchPagesRun?.status === "completed") {
                core.info("Branch-based Pages workflow has completed.");
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            core.setFailed("Timed out waiting for the branch-based Pages workflow.");
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
